<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organiser dashboard · RoomRadar</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .stats { display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 12px; margin: 16px 0; }
    .stat { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; }
    .stat b { display: block; font: 800 2.2rem var(--display); line-height: 1; }
    .stat.main { border-color: var(--ink); }
    .stat.main b { font-size: 3.6rem; }
    .cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
    .box { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 16px; }
    .bar { display: grid; grid-template-columns: 140px 1fr 32px; gap: 8px; align-items: center; margin: 6px 0; font-size: .92rem; }
    .bar i { display: block; height: 12px; background: var(--ink); border-radius: 6px; }
    .bar.need i { background: var(--highlight); outline: 1px solid var(--ink); }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-family: var(--display); }
    .status-left { color: var(--ink-soft); }
    .tablewrap { overflow-x: auto; }
    svg.timeline { width: 100%; height: 160px; }
    @media (max-width: 860px) { .stats { grid-template-columns: repeat(2, 1fr); } .stat.main { grid-column: span 2; } .cols { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main class="wrap wide" id="view"><p class="empty">Loading…</p></main>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
  import { api, esc, ago, toast } from '/common.js';
  const id = location.pathname.split('/')[2].toUpperCase();
  const key = new URLSearchParams(location.search).get('key') || localStorage.getItem(`rr-host-${id}`);
  const view = document.getElementById('view');
  let statusFilter = 'present';

  function timelineSvg(events, w = 600, h = 160) {
    if (!events.length) return '<p class="muted">Check-ins will draw a live attendance curve here.</p>';
    let n = 0, peak = 0;
    const pts = events.map((e) => { n += e.kind === 'in' ? 1 : -1; peak = Math.max(peak, n); return [e.at, n]; });
    pts.push([Date.now(), n]);
    const t0 = pts[0][0], t1 = Math.max(pts.at(-1)[0], t0 + 60_000);
    const x = (t) => ((t - t0) / (t1 - t0)) * (w - 20) + 10;
    const y = (v) => h - 20 - (v / Math.max(peak, 1)) * (h - 40);
    let d = `M${x(pts[0][0])},${y(0)}`;
    for (const [t, v] of pts) d += ` H${x(t).toFixed(1)} V${y(v).toFixed(1)}`;
    return `<svg class="timeline" viewBox="0 0 ${w} ${h}" role="img" aria-label="People in the room over time, peak ${peak}">
      <line x1="10" x2="${w - 10}" y1="${h - 20}" y2="${h - 20}" stroke="#cbd3e6" stroke-width="2"/>
      <path d="${d}" fill="none" stroke="#1b2340" stroke-width="3" stroke-linejoin="round"/>
      <text x="10" y="14" font-size="12" fill="#4b5474">Peak ${peak}</text>
      <text x="10" y="${h - 4}" font-size="12" fill="#4b5474">${new Date(t0).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</text>
      <text x="${w - 10}" y="${h - 4}" font-size="12" fill="#4b5474" text-anchor="end">now</text></svg>`;
  }

  async function load() {
    let d;
    try { d = await api(`/api/host/${id}`, { hostKey: key }); }
    catch (e) { view.innerHTML = `<div class="error">${esc(e.message)}</div>`; return; }
    localStorage.setItem(`rr-host-${id}`, key);
    const s = d.stats;
    const maxI = Math.max(1, ...d.topInterests.map((x) => x[1]));
    const maxN = Math.max(1, ...d.topNeeds.map((x) => x[1]));
    // Keep whatever the organiser is typing: live updates redraw the page.
    const draft = document.getElementById('ann-text');
    const draftValue = draft ? draft.value : null, draftFocused = draft && document.activeElement === draft;
    const rows = d.attendees.filter((a) => statusFilter === 'all' || a.status === statusFilter)
      .sort((a, b) => b.checkedInAt - a.checkedInAt);
    view.innerHTML = `
      <div class="topbar"><div><h1 style="font-size:2rem;margin:0">${esc(d.event.name)}</h1><span class="muted">Event code ${esc(d.event.id)} ${d.event.venue ? `at ${esc(d.event.venue)}` : ''}</span></div><span class="live">Live</span></div>
      <div class="stats">
        <div class="stat main"><b>${s.present}</b>in the room now</div>
        <div class="stat"><b>${s.checkedIn}</b>checked in</div>
        <div class="stat"><b>${s.left}</b>have left</div>
        <div class="stat"><b>${s.waves}</b>waves sent</div>
        <div class="stat"><b>${s.connections}</b>connections made</div>
      </div>
      <div class="cols">
        <div class="box"><h3>Attendance tonight</h3>${timelineSvg(d.timeline)}</div>
        <div class="box">
          <h3>Send an announcement</h3>
          <form id="ann"><input type="text" id="ann-text" maxlength="200" placeholder="Pizza is at the terrace" value="${esc(d.event.announcement || '')}">
          <div class="actions"><button class="btn small">Send to everyone</button><a class="btn small ghost" href="/e/${esc(id)}/screen" target="_blank">Entrance screen</a><a class="btn small ghost" href="/api/host/${esc(id)}/export.csv?key=${encodeURIComponent(key)}">Download attendance (CSV)</a></div></form>
        </div>
      </div>
      <div class="cols" style="margin-top:16px">
        <div class="box"><h3>What the room is into</h3>${d.topInterests.map(([t, n]) => `<div class="bar"><span>${esc(t)}</span><i style="width:${(n / maxI) * 100}%"></i><b>${n}</b></div>`).join('') || '<p class="muted">No one yet.</p>'}</div>
        <div class="box"><h3>What people are looking for</h3>${d.topNeeds.map(([t, n]) => `<div class="bar need"><span>${esc(t)}</span><i style="width:${(n / maxN) * 100}%"></i><b>${n}</b></div>`).join('') || '<p class="muted">No one yet.</p>'}
          <p class="muted small" style="margin-top:10px">Use this to plan introductions: if five people want investors, invite one to say hello.</p></div>
      </div>
      <div class="box" style="margin-top:16px">
        <div class="topbar"><h3 style="margin:0">Attendees</h3>
          <div class="chips" id="sf">${['present', 'left', 'all'].map((f) => `<button class="chip" data-f="${f}" aria-pressed="${f === statusFilter}">${{ present: 'Here now', left: 'Left', all: 'Everyone' }[f]}</button>`).join('')}</div></div>
        <div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Arrived</th><th>Area</th><th>Interests</th></tr></thead><tbody>
        ${rows.map((a) => `<tr class="${a.status === 'left' ? 'status-left' : ''}"><td>${esc(a.emoji)} ${esc(a.name)}</td><td>${esc([a.role, a.org].filter(Boolean).join(', '))}</td><td>${a.status === 'present' ? 'Here' : `Left ${ago(a.leftAt)}`}</td><td>${ago(a.checkedInAt)}</td><td>${esc(a.zone || '')}</td><td>${esc(a.interests.join(', '))}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No one here yet. Put the entrance screen up so people can scan in.</td></tr>'}
        </tbody></table></div>
      </div>`;
    const annInput = document.getElementById('ann-text');
    if (draftValue !== null) { annInput.value = draftValue; if (draftFocused) { annInput.focus(); annInput.setSelectionRange(draftValue.length, draftValue.length); } }
    document.getElementById('ann').onsubmit = async (e) => {
      e.preventDefault();
      await api(`/api/host/${id}/announce`, { method: 'POST', hostKey: key, body: { text: document.getElementById('ann-text').value } });
      toast('Announcement sent to everyone in the room.');
    };
    document.getElementById('sf').onclick = (e) => { const b = e.target.closest('[data-f]'); if (b) { statusFilter = b.dataset.f; load(); } };
  }

  const socket = io({ auth: { eventId: id, hostKey: key } });
  let t; socket.on('host:changed', () => { clearTimeout(t); t = setTimeout(load, 300); });
  setInterval(load, 60_000); // keeps "x min ago" labels fresh
  load();
</script>
</body>
</html>
