<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan to check in · RoomRadar</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: var(--ink); color: #fff; min-height: 100vh; }
    .screen { display: grid; grid-template-columns: auto 1fr; gap: 6vw; align-items: center; min-height: 100vh; padding: 5vw; }
    .qrbox { background: #fff; padding: 2vw; border-radius: 28px; }
    .qrbox img { width: min(38vw, 60vh); height: auto; display: block; }
    h1 { font-size: clamp(2.4rem, 5.5vw, 5rem); }
    .code { font: 800 clamp(1.6rem, 3vw, 2.6rem) var(--display); letter-spacing: .2em; background: var(--highlight); color: var(--ink); display: inline-block; padding: 4px 16px; border-radius: 10px; }
    .headcount { font: 800 clamp(4rem, 10vw, 8rem) var(--display); line-height: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .tags span { border: 2px solid #fff; border-radius: 999px; padding: 6px 14px; font-size: clamp(1rem, 1.6vw, 1.3rem); }
    @media (max-width: 800px) { .screen { grid-template-columns: 1fr; text-align: center; } .qrbox { justify-self: center; } .tags { justify-content: center; } }
  </style>
</head>
<body>
<div class="screen">
  <div class="qrbox"><img id="qr" alt="QR code to check in"></div>
  <div>
    <h1 id="name">…</h1>
    <p style="font-size:1.4rem">Scan to check in and see who you should meet tonight.</p>
    <p>Or go to <strong id="host"></strong> and enter <span class="code" id="code"></span></p>
    <div style="margin-top:4vh"><div class="headcount" id="count">0</div><div style="font-size:1.3rem">people in the room · <span id="conns">0</span> connections made</div></div>
    <div class="tags" id="tags"></div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
  import { api, esc } from '/common.js';
  const id = location.pathname.split('/')[2].toUpperCase();
  document.getElementById('qr').src = `/api/events/${id}/qr.svg`;
  document.getElementById('code').textContent = id;
  document.getElementById('host').textContent = location.host;
  async function load() {
    const d = await api(`/api/events/${id}/pulse`);
    document.getElementById('name').textContent = d.event.name;
    document.getElementById('count').textContent = d.presentCount;
    document.getElementById('conns').textContent = d.connections;
    document.getElementById('tags').innerHTML = d.topInterests.map(([t, n]) => `<span>${n} into ${esc(t)}</span>`).join('');
  }
  const socket = io({ auth: { eventId: id } });
  let t; socket.on('room:changed', () => { clearTimeout(t); t = setTimeout(load, 300); });
  load();
</script>
</body>
</html>
